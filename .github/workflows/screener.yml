name: Run Daily Screener

on:
  schedule:
    # S'exécute du lundi au vendredi à 16h00 UTC (soit 17h00 heure d'hiver / 18h00 heure d'été à Paris)
    - cron: '15 13 * * 0'
      timezone: "Europe/Paris"
  workflow_dispatch: # Permet de lancer le script manuellement en un clic pour tester

# Force l'utilisation de Node.js 24 pour supprimer l'avertissement de dépréciation
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Installer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas requests numpy

    - name: Exécuter le screener
      run: python main.py
